#
# Steelbore — Starship prompt theme (catppuccin-powerline preset, Spacecraft Software palette)
# GENERATED by tools/steelbore_themes from Steelbore/steelbore.toml (palette family v3.5.0, The Steelbore Standard §11 v2.08). Do not edit by hand — regenerate.
# Theme slug: steelbore · palette: steelbore · variant: base
# Conformance: WCAG 2.2 AA verified against the palette canvas (§11)
# Maintainer: Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org> · https://Theme.SpacecraftSoftware.org/
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](red)\
$os\
$username\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:green bg:sapphire)\
$conda\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
$cmd_duration\
$line_break\
$character"""

palette = 'spacecraft_software'

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[bun]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[c]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[php]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[kotlin]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[haskell]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[conda]
symbol = "  "
style = "fg:crust bg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:lavender"
disabled = false
show_notifications = true
min_time_to_notify = 45000

# ------------------------------------------------------------------------------
# PALETTE DEFINITION — Spacecraft Software
# Catppuccin role keys are preserved (red, peach, yellow, green, sapphire,
# lavender, crust, …) so the upstream preset layout above renders unchanged,
# but every value resolves to a role token from this theme
# (Steelbore Standard §11.1) instead of a Catppuccin hue.
# ------------------------------------------------------------------------------
[palettes.spacecraft_software]
# Powerline section accents (used as block backgrounds in the format string,
# with crust text rendered directly on top). This is a fill + inverted
# background-role text pairing, not accent-as-foreground-text, so peach uses
# plain accent -- text_safe_accent's restriction doesn't apply here (tools/
# README.md rule 3): the same contrast ratio measured the other way is a
# verified pairing regardless of the accent's text-safety restriction.
red       = "#FF3B3B"      # error
peach     = "#FF5E00"      # accent
yellow    = "#8A6CFF"      # structure
green     = "#B4FF00"      # success
sapphire  = "#B4FF00"      # focus
lavender  = "#8A6CFF"      # structure

# Canvas — also the text colour on top of the bright section blocks above
crust     = "#000027"
mantle    = "#000027"
base      = "#000027"

# Secondary surfaces
surface0  = "#0E2A47"
surface1  = "#0E2A47"
surface2  = "#0E2A47"

# Dim / muted scale
overlay0  = "#8A6CFF"
overlay1  = "#8A6CFF"
overlay2  = "#8A6CFF"

# Foreground text scale
text      = "#D9DEE5"
subtext0  = "#D9DEE5"
subtext1  = "#D9DEE5"

# Remaining catppuccin role keys mapped to the nearest Spacecraft Software role
rosewater = "#FF3B3B"
flamingo  = "#FF3B3B"
pink      = "#FF3B3B"
mauve     = "#FF3B3B"
maroon    = "#FF3B3B"
teal      = "#B4FF00"
sky       = "#B4FF00"
blue      = "#8A6CFF"
