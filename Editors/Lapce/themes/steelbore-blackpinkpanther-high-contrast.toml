[theme]
name = "Steelbore BlackPinkPanther High Contrast"
author = "Mohamed Hammad"
color-theme.name = "Steelbore BlackPinkPanther High Contrast"
color-theme.type = "dark"

[color-theme.ui]
# Editor
"editor.background" = "#000000"
"editor.foreground" = "#FFFFFF"
"editor.dim" = "#FF70BE"
"editor.focus" = "#FF5FC0"
"editor.caret" = "#FFFFFF"
"editor.selection" = "#FF5FC040"
"editor.current_line" = "#2E0020"
"editor.debug_break_line" = "#FFC85740"
"editor.link" = "#FF70BE"
"editor.visible_whitespace" = "#FF70BE40"
"editor.indent_guide" = "#FF70BE20"
"editor.drag_drop_background" = "#FF5FC040"
"editor.drag_drop_tab_background" = "#18000E40"
"editor.sticky_header_background" = "#2E0020"
"editor.line_number" = "#FF70BE"
"editor.active_line_number" = "#FFFFFF"

# Top-level link (legacy bare key, kept alongside editor.link)
"link" = "#FF70BE"

# Inlay hints / error lens / completion lens
"inlay_hint.foreground" = "#FF70BE"
"inlay_hint.background" = "#FF5FC020"
"error_lens.error.foreground" = "#FF6B6B"
"error_lens.error.background" = "#FF6B6B20"
"error_lens.warning.foreground" = "#FFC857"
"error_lens.warning.background" = "#FFC85720"
"error_lens.other.foreground" = "#FF70BE"
"error_lens.other.background" = "#FF70BE20"
"completion_lens.foreground" = "#FF70BE"

# Panel
"panel.background" = "#2E0020"
"panel.foreground" = "#FFFFFF"
"panel.foreground.dim" = "#FF70BE"
"panel.current.background" = "#FF5FC040"
"panel.current.foreground" = "#FFFFFF"
"panel.current.foreground.dim" = "#FF70BE"
"panel.hovered.background" = "#18000E"
"panel.hovered.active.background" = "#2E0020"
"panel.hovered.active.foreground" = "#FF5FC0"
"panel.hovered.foreground" = "#FFFFFF"
"panel.hovered.foreground.dim" = "#FF70BE"

# Status bar — modal fills use background-coloured text on a role
# fill, the one inversion rule 3 allows (background text on an
# accent/structure/success/error fill); each of the four modes
# takes a distinct role from that exact list, never focus/warning.
"status.background" = "#000000"
"status.foreground" = "#FF70BE"
"status.modal.normal.background" = "#FF70BE"
"status.modal.normal.foreground" = "#000000"
"status.modal.insert.background" = "#5BE49B"
"status.modal.insert.foreground" = "#000000"
"status.modal.visual.background" = "#FF6B6B"
"status.modal.visual.foreground" = "#000000"
"status.modal.terminal.background" = "#FF5FC0"
"status.modal.terminal.foreground" = "#000000"

# Tabs — underline is decorative (rule 4: plain accent is fine for
# non-text fills/borders/icons); the active label is text, so it
# takes the text-safe accent.
"lapce.tab.active.background" = "#000000"
"lapce.tab.active.foreground" = "#FF5FC0"
"lapce.tab.active.underline" = "#FF5FC0"
"lapce.tab.inactive.background" = "#2E0020"
"lapce.tab.inactive.foreground" = "#FF70BE"
"lapce.tab.inactive.underline" = "#FF5FC077"
"lapce.tab.separator" = "#FF70BE"

# Scroll bar / dropdown shadow / border
"lapce.scroll_bar" = "#FF70BE70"
"lapce.dropdown_shadow" = "#00000080"
"lapce.border" = "#FF70BE"

# Buttons — the fill takes the text-safe accent so the background-
# coloured label on top (the allowed inversion, rule 3) stays a
# verified pairing even under Steelbore Blue's restricted accent.
"lapce.button.primary.background" = "#FF5FC0"
"lapce.button.primary.foreground" = "#000000"

# Icons
"lapce.icon.active" = "#FFFFFF"
"lapce.icon.inactive" = "#FF70BE"

# Remote status
"lapce.remote.icon" = "#000000"
"lapce.remote.local" = "#FF70BE"
"lapce.remote.connected" = "#5BE49B"
"lapce.remote.connecting" = "#FFC857"
"lapce.remote.disconnected" = "#FF6B6B"

# Plugin list
"lapce.plugin.name" = "#FFFFFF"
"lapce.plugin.description" = "#FF70BE"
"lapce.plugin.author" = "#FF70BE"

# Top-level status aliases
"lapce.error" = "#FF6B6B"
"lapce.warn" = "#FFC857"

# Source control
"source_control.added" = "#5BE49BCC"
"source_control.removed" = "#FF6B6BCC"
