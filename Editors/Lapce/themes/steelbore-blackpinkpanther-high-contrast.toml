"tooltip.foreground" = "#FFFFFF"
"palette.background" = "#2E0020"
"palette.foreground" = "#FFFFFF"
"palette.current.background" = "#FF5FC040"
"palette.current.foreground" = "#FFFFFF"
"completion.background" = "#2E0020"
"completion.current" = "#FF5FC040"
"hover.background" = "#2E0020"

# Activity bar
"activity.background" = "#2E0020"
"activity.current" = "#000000"

# Debug
