"tooltip.foreground" = "#C0CAF5"
"palette.background" = "#24283B"
"palette.foreground" = "#C0CAF5"
"palette.current.background" = "#97B6F940"
"palette.current.foreground" = "#C0CAF5"
"completion.background" = "#24283B"
