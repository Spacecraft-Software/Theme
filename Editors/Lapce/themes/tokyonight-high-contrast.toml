"editor.drag_drop_tab_background" = "#16161E40"
"editor.sticky_header_background" = "#24283B"
"editor.line_number" = "#BB9AF7"
"editor.active_line_number" = "#C0CAF5"

# Top-level link (legacy bare key, kept alongside editor.link)
"link" = "#BB9AF7"

# Inlay hints / error lens / completion lens
"inlay_hint.foreground" = "#BB9AF7"
"inlay_hint.background" = "#7DCFFF20"
"error_lens.error.foreground" = "#F998AA"
"error_lens.error.background" = "#F998AA20"
"error_lens.warning.foreground" = "#E0AF68"
"error_lens.warning.background" = "#E0AF6820"
"error_lens.other.foreground" = "#BB9AF7"
"error_lens.other.background" = "#BB9AF720"
"completion_lens.foreground" = "#BB9AF7"

# Panel
"panel.background" = "#24283B"
"panel.foreground" = "#C0CAF5"
"panel.foreground.dim" = "#BB9AF7"
"panel.current.background" = "#97B6F940"
"panel.current.foreground" = "#C0CAF5"
"panel.current.foreground.dim" = "#BB9AF7"
"panel.hovered.background" = "#16161E"
"panel.hovered.active.background" = "#24283B"
"panel.hovered.active.foreground" = "#97B6F9"
"panel.hovered.foreground" = "#C0CAF5"
"panel.hovered.foreground.dim" = "#BB9AF7"

# Status bar — modal fills use background-coloured text on a role
# fill, the one inversion rule 3 allows (background text on an
# accent/structure/success/error fill); each of the four modes
# takes a distinct role from that exact list, never focus/warning.
"status.background" = "#1A1B26"
"status.foreground" = "#BB9AF7"
"status.modal.normal.background" = "#BB9AF7"
"status.modal.normal.foreground" = "#1A1B26"
"status.modal.insert.background" = "#9ECE6A"
"status.modal.insert.foreground" = "#1A1B26"
"status.modal.visual.background" = "#F998AA"
"status.modal.visual.foreground" = "#1A1B26"
"status.modal.terminal.background" = "#97B6F9"
"status.modal.terminal.foreground" = "#1A1B26"

# Tabs — underline is decorative (rule 4: plain accent is fine for
# non-text fills/borders/icons); the active label is text, so it
# takes the text-safe accent.
"lapce.tab.active.background" = "#1A1B26"
"lapce.tab.active.foreground" = "#97B6F9"
"lapce.tab.active.underline" = "#97B6F9"
"lapce.tab.inactive.background" = "#24283B"
"lapce.tab.inactive.foreground" = "#BB9AF7"
"lapce.tab.inactive.underline" = "#97B6F977"
"lapce.tab.separator" = "#BB9AF7"

# Scroll bar / dropdown shadow / border
"lapce.scroll_bar" = "#BB9AF770"
"lapce.dropdown_shadow" = "#1A1B2680"
"lapce.border" = "#BB9AF7"

# Buttons — the fill takes the text-safe accent so the background-
# coloured label on top (the allowed inversion, rule 3) stays a
# verified pairing even under Steelbore Blue's restricted accent.
"lapce.button.primary.background" = "#97B6F9"
"lapce.button.primary.foreground" = "#1A1B26"

# Icons
"lapce.icon.active" = "#C0CAF5"
"lapce.icon.inactive" = "#BB9AF7"

# Remote status
