"editor.sticky_header_background" = "#073642"
"editor.line_number" = "#6C71C4"
"editor.active_line_number" = "#839496"

# Top-level link (legacy bare key, kept alongside editor.link)
"link" = "#6C71C4"

# Inlay hints / error lens / completion lens
