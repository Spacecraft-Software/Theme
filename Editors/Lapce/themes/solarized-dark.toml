"error_lens.other.foreground" = "#6C71C4"
"error_lens.other.background" = "#6C71C420"
"completion_lens.foreground" = "#6C71C4"

# Panel
"panel.background" = "#073642"
"panel.foreground" = "#839496"
"panel.foreground.dim" = "#6C71C4"
"panel.current.background" = "#268BD240"
"panel.current.foreground" = "#839496"
"panel.current.foreground.dim" = "#6C71C4"
