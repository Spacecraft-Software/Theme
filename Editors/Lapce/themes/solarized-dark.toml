# Status bar — modal fills use background-coloured text on a role
# fill, the one inversion rule 3 allows (background text on an
# accent/structure/success/error fill); each of the four modes
# takes a distinct role from that exact list, never focus/warning.
"status.background" = "#002B36"
"status.foreground" = "#6C71C4"
"status.modal.normal.background" = "#6C71C4"
"status.modal.normal.foreground" = "#002B36"
"status.modal.insert.background" = "#859900"
"status.modal.insert.foreground" = "#002B36"
"status.modal.visual.background" = "#DC322F"
"status.modal.visual.foreground" = "#002B36"
"status.modal.terminal.background" = "#268BD2"
"status.modal.terminal.foreground" = "#002B36"

# Tabs — underline is decorative (rule 4: plain accent is fine for
# non-text fills/borders/icons); the active label is text, so it
# takes the text-safe accent.
"lapce.tab.active.background" = "#002B36"
"lapce.tab.active.foreground" = "#268BD2"
"lapce.tab.active.underline" = "#268BD2"
"lapce.tab.inactive.background" = "#073642"
"lapce.tab.inactive.foreground" = "#6C71C4"
"lapce.tab.inactive.underline" = "#268BD277"
"lapce.tab.separator" = "#6C71C4"

# Scroll bar / dropdown shadow / border
"lapce.scroll_bar" = "#6C71C470"
"lapce.dropdown_shadow" = "#002B3680"
"lapce.border" = "#6C71C4"

# Buttons — the fill takes the text-safe accent so the background-
# coloured label on top (the allowed inversion, rule 3) stays a
# verified pairing even under Steelbore Blue's restricted accent.
"lapce.button.primary.background" = "#268BD2"
"lapce.button.primary.foreground" = "#002B36"

# Icons
"lapce.icon.active" = "#839496"
"lapce.icon.inactive" = "#6C71C4"

# Remote status
