[theme]
name = "Steelbore Green Alt"
author = "Mohamed Hammad"
color-theme.name = "Steelbore Green Alt"
color-theme.type = "dark"

[color-theme.ui]
# Editor
"editor.background" = "#0D0208"
"editor.foreground" = "#D7F5E0"
"editor.dim" = "#1CA152"
"editor.focus" = "#00FF41"
"editor.caret" = "#D7F5E0"
"editor.selection" = "#00FF4140"
"editor.current_line" = "#08180C"
"editor.debug_break_line" = "#FFC85740"
"editor.link" = "#1CA152"
"editor.visible_whitespace" = "#1CA15240"
"editor.indent_guide" = "#1CA15220"
"editor.drag_drop_background" = "#00FF4140"
"editor.drag_drop_tab_background" = "#03030340"
"editor.sticky_header_background" = "#08180C"
"editor.line_number" = "#1CA152"
"editor.active_line_number" = "#D7F5E0"

# Top-level link (legacy bare key, kept alongside editor.link)
"link" = "#1CA152"

# Inlay hints / error lens / completion lens
"inlay_hint.foreground" = "#1CA152"
"inlay_hint.background" = "#00FF4120"
"error_lens.error.foreground" = "#FF6B6B"
"error_lens.error.background" = "#FF6B6B20"
"error_lens.warning.foreground" = "#FFC857"
"error_lens.warning.background" = "#FFC85720"
"error_lens.other.foreground" = "#1CA152"
"error_lens.other.background" = "#1CA15220"
"completion_lens.foreground" = "#1CA152"

# Panel
"panel.background" = "#08180C"
"panel.foreground" = "#D7F5E0"
"panel.foreground.dim" = "#1CA152"
"panel.current.background" = "#00FF4140"
"panel.current.foreground" = "#D7F5E0"
"panel.current.foreground.dim" = "#1CA152"
"panel.hovered.background" = "#030303"
"panel.hovered.active.background" = "#08180C"
"panel.hovered.active.foreground" = "#00FF41"
"panel.hovered.foreground" = "#D7F5E0"
"panel.hovered.foreground.dim" = "#1CA152"

# Status bar — modal fills use background-coloured text on a role
# fill, the one inversion rule 3 allows (background text on an
# accent/structure/success/error fill); each of the four modes
# takes a distinct role from that exact list, never focus/warning.
"status.background" = "#0D0208"
"status.foreground" = "#1CA152"
"status.modal.normal.background" = "#1CA152"
"status.modal.normal.foreground" = "#0D0208"
"status.modal.insert.background" = "#00AD15"
"status.modal.insert.foreground" = "#0D0208"
"status.modal.visual.background" = "#FF6B6B"
"status.modal.visual.foreground" = "#0D0208"
"status.modal.terminal.background" = "#00FF41"
"status.modal.terminal.foreground" = "#0D0208"

# Tabs — underline is decorative (rule 4: plain accent is fine for
# non-text fills/borders/icons); the active label is text, so it
# takes the text-safe accent.
"lapce.tab.active.background" = "#0D0208"
"lapce.tab.active.foreground" = "#00FF41"
"lapce.tab.active.underline" = "#00FF41"
"lapce.tab.inactive.background" = "#08180C"
"lapce.tab.inactive.foreground" = "#1CA152"
"lapce.tab.inactive.underline" = "#00FF4177"
"lapce.tab.separator" = "#1CA152"

# Scroll bar / dropdown shadow / border
"lapce.scroll_bar" = "#1CA15270"
"lapce.dropdown_shadow" = "#0D020880"
"lapce.border" = "#1CA152"

# Buttons — the fill takes the text-safe accent so the background-
# coloured label on top (the allowed inversion, rule 3) stays a
# verified pairing even under Steelbore Blue's restricted accent.
"lapce.button.primary.background" = "#00FF41"
"lapce.button.primary.foreground" = "#0D0208"

# Icons
"lapce.icon.active" = "#D7F5E0"
"lapce.icon.inactive" = "#1CA152"

# Remote status
"lapce.remote.icon" = "#0D0208"
"lapce.remote.local" = "#1CA152"
"lapce.remote.connected" = "#00AD15"
"lapce.remote.connecting" = "#FFC857"
"lapce.remote.disconnected" = "#FF6B6B"

# Plugin list
"lapce.plugin.name" = "#D7F5E0"
"lapce.plugin.description" = "#1CA152"
"lapce.plugin.author" = "#1CA152"

# Top-level status aliases
"lapce.error" = "#FF6B6B"
"lapce.warn" = "#FFC857"

# Source control
"source_control.added" = "#00AD15CC"
"source_control.removed" = "#FF6B6BCC"
"source_control.modified" = "#FFC857CC"

# Tooltip / palette / completion / hover
"tooltip.background" = "#08180C"
"tooltip.foreground" = "#D7F5E0"
"palette.background" = "#08180C"
"palette.foreground" = "#D7F5E0"
"palette.current.background" = "#00FF4140"
"palette.current.foreground" = "#D7F5E0"
"completion.background" = "#08180C"
"completion.current" = "#00FF4140"
"hover.background" = "#08180C"

# Activity bar
"activity.background" = "#08180C"
"activity.current" = "#0D0208"

# Debug
