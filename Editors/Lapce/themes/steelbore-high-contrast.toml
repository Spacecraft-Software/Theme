[theme]
name = "Steelbore High Contrast"
author = "Mohamed Hammad"
color-theme.name = "Steelbore High Contrast"
color-theme.type = "dark"

[color-theme.ui]
# Editor
"editor.background" = "#000027"
"editor.foreground" = "#D9DEE5"
"editor.dim" = "#B3A1FF"
"editor.focus" = "#B4FF00"
"editor.caret" = "#D9DEE5"
"editor.selection" = "#FF8A3D40"
"editor.current_line" = "#0E2A47"
"editor.debug_break_line" = "#EE7BFF40"
"editor.link" = "#B3A1FF"
"editor.visible_whitespace" = "#B3A1FF40"
"editor.indent_guide" = "#B3A1FF20"
"editor.drag_drop_background" = "#FF8A3D40"
"editor.drag_drop_tab_background" = "#0B1A1240"
"editor.sticky_header_background" = "#0E2A47"
"editor.line_number" = "#B3A1FF"
"editor.active_line_number" = "#D9DEE5"

# Top-level link (legacy bare key, kept alongside editor.link)
"link" = "#B3A1FF"

# Inlay hints / error lens / completion lens
"inlay_hint.foreground" = "#B3A1FF"
"inlay_hint.background" = "#B4FF0020"
"error_lens.error.foreground" = "#FF7A7A"
"error_lens.error.background" = "#FF7A7A20"
"error_lens.warning.foreground" = "#EE7BFF"
"error_lens.warning.background" = "#EE7BFF20"
"error_lens.other.foreground" = "#B3A1FF"
"error_lens.other.background" = "#B3A1FF20"
"completion_lens.foreground" = "#B3A1FF"

# Panel
"panel.background" = "#0E2A47"
"panel.foreground" = "#D9DEE5"
"panel.foreground.dim" = "#B3A1FF"
"panel.current.background" = "#FF8A3D40"
"panel.current.foreground" = "#D9DEE5"
"panel.current.foreground.dim" = "#B3A1FF"
"panel.hovered.background" = "#0B1A12"
"panel.hovered.active.background" = "#0E2A47"
"panel.hovered.active.foreground" = "#FF8A3D"
"panel.hovered.foreground" = "#D9DEE5"
"panel.hovered.foreground.dim" = "#B3A1FF"

# Status bar — modal fills use background-coloured text on a role
# fill, the one inversion rule 3 allows (background text on an
# accent/structure/success/error fill); each of the four modes
# takes a distinct role from that exact list, never focus/warning.
"status.background" = "#000027"
"status.foreground" = "#B3A1FF"
"status.modal.normal.background" = "#B3A1FF"
"status.modal.normal.foreground" = "#000027"
"status.modal.insert.background" = "#B4FF00"
"status.modal.insert.foreground" = "#000027"
"status.modal.visual.background" = "#FF7A7A"
"status.modal.visual.foreground" = "#000027"
"status.modal.terminal.background" = "#FF8A3D"
"status.modal.terminal.foreground" = "#000027"

# Tabs — underline is decorative (rule 4: plain accent is fine for
# non-text fills/borders/icons); the active label is text, so it
# takes the text-safe accent.
"lapce.tab.active.background" = "#000027"
"lapce.tab.active.foreground" = "#FF8A3D"
"lapce.tab.active.underline" = "#FF8A3D"
"lapce.tab.inactive.background" = "#0E2A47"
"lapce.tab.inactive.foreground" = "#B3A1FF"
"lapce.tab.inactive.underline" = "#FF8A3D77"
"lapce.tab.separator" = "#B3A1FF"

# Scroll bar / dropdown shadow / border
"lapce.scroll_bar" = "#B3A1FF70"
"lapce.dropdown_shadow" = "#00002780"
"lapce.border" = "#B3A1FF"

# Buttons — the fill takes the text-safe accent so the background-
# coloured label on top (the allowed inversion, rule 3) stays a
# verified pairing even under Steelbore Blue's restricted accent.
"lapce.button.primary.background" = "#FF8A3D"
"lapce.button.primary.foreground" = "#000027"

# Icons
"lapce.icon.active" = "#D9DEE5"
"lapce.icon.inactive" = "#B3A1FF"

# Remote status
"lapce.remote.icon" = "#000027"
"lapce.remote.local" = "#B3A1FF"
"lapce.remote.connected" = "#B4FF00"
"lapce.remote.connecting" = "#EE7BFF"
"lapce.remote.disconnected" = "#FF7A7A"

# Plugin list
"lapce.plugin.name" = "#D9DEE5"
"lapce.plugin.description" = "#B3A1FF"
"lapce.plugin.author" = "#B3A1FF"

# Top-level status aliases
"lapce.error" = "#FF7A7A"
"lapce.warn" = "#EE7BFF"

# Source control
"source_control.added" = "#B4FF00CC"
"source_control.removed" = "#FF7A7ACC"
"source_control.modified" = "#EE7BFFCC"

# Tooltip / palette / completion / hover
"tooltip.background" = "#0E2A47"
"tooltip.foreground" = "#D9DEE5"
"palette.background" = "#0E2A47"
"palette.foreground" = "#D9DEE5"
"palette.current.background" = "#FF8A3D40"
"palette.current.foreground" = "#D9DEE5"
"completion.background" = "#0E2A47"
"completion.current" = "#FF8A3D40"
"hover.background" = "#0E2A47"

# Activity bar
"activity.background" = "#0E2A47"
"activity.current" = "#000027"

# Debug
"debug.breakpoint" = "#FF7A7A"
"debug.breakpoint.hover" = "#FF7A7A40"

# Markdown
"markdown.blockquote" = "#B3A1FF"

