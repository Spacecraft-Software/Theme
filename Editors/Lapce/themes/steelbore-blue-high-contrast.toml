"tooltip.foreground" = "#E6F0FF"
"palette.background" = "#0F1728"
"palette.foreground" = "#E6F0FF"
"palette.current.background" = "#79B4FF40"
"palette.current.foreground" = "#E6F0FF"
"completion.background" = "#0F1728"
