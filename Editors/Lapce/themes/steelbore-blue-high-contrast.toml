[theme]
name = "Steelbore Blue High Contrast"
author = "Mohamed Hammad"
color-theme.name = "Steelbore Blue High Contrast"
color-theme.type = "dark"

[color-theme.ui]
# Editor
"editor.background" = "#0A1024"
"editor.foreground" = "#E6F0FF"
"editor.dim" = "#66A3FF"
"editor.focus" = "#FF8A4B"
"editor.caret" = "#E6F0FF"
"editor.selection" = "#79B4FF40"
"editor.current_line" = "#0F1728"
"editor.debug_break_line" = "#FFC85740"
"editor.link" = "#66A3FF"
"editor.visible_whitespace" = "#66A3FF40"
"editor.indent_guide" = "#66A3FF20"
"editor.drag_drop_background" = "#79B4FF40"
"editor.drag_drop_tab_background" = "#1B243640"
"editor.sticky_header_background" = "#0F1728"
"editor.line_number" = "#66A3FF"
"editor.active_line_number" = "#E6F0FF"

# Top-level link (legacy bare key, kept alongside editor.link)
"link" = "#66A3FF"

# Inlay hints / error lens / completion lens
"inlay_hint.foreground" = "#66A3FF"
"inlay_hint.background" = "#FF8A4B20"
"error_lens.error.foreground" = "#FF8F8F"
"error_lens.error.background" = "#FF8F8F20"
"error_lens.warning.foreground" = "#FFC857"
"error_lens.warning.background" = "#FFC85720"
"error_lens.other.foreground" = "#66A3FF"
"error_lens.other.background" = "#66A3FF20"
"completion_lens.foreground" = "#66A3FF"

# Panel
"panel.background" = "#0F1728"
"panel.foreground" = "#E6F0FF"
"panel.foreground.dim" = "#66A3FF"
"panel.current.background" = "#79B4FF40"
"panel.current.foreground" = "#E6F0FF"
"panel.current.foreground.dim" = "#66A3FF"
"panel.hovered.background" = "#1B2436"
"panel.hovered.active.background" = "#0F1728"
"panel.hovered.active.foreground" = "#79B4FF"
"panel.hovered.foreground" = "#E6F0FF"
"panel.hovered.foreground.dim" = "#66A3FF"

# Status bar — modal fills use background-coloured text on a role
# fill, the one inversion rule 3 allows (background text on an
# accent/structure/success/error fill); each of the four modes
# takes a distinct role from that exact list, never focus/warning.
"status.background" = "#0A1024"
"status.foreground" = "#66A3FF"
"status.modal.normal.background" = "#66A3FF"
"status.modal.normal.foreground" = "#0A1024"
"status.modal.insert.background" = "#28C76F"
"status.modal.insert.foreground" = "#0A1024"
"status.modal.visual.background" = "#FF8F8F"
"status.modal.visual.foreground" = "#0A1024"
"status.modal.terminal.background" = "#79B4FF"
"status.modal.terminal.foreground" = "#0A1024"

# Tabs — underline is decorative (rule 4: plain accent is fine for
# non-text fills/borders/icons); the active label is text, so it
# takes the text-safe accent.
"lapce.tab.active.background" = "#0A1024"
"lapce.tab.active.foreground" = "#79B4FF"
"lapce.tab.active.underline" = "#79B4FF"
"lapce.tab.inactive.background" = "#0F1728"
"lapce.tab.inactive.foreground" = "#66A3FF"
"lapce.tab.inactive.underline" = "#79B4FF77"
"lapce.tab.separator" = "#66A3FF"

# Scroll bar / dropdown shadow / border
"lapce.scroll_bar" = "#66A3FF70"
"lapce.dropdown_shadow" = "#0A102480"
"lapce.border" = "#66A3FF"

# Buttons — the fill takes the text-safe accent so the background-
# coloured label on top (the allowed inversion, rule 3) stays a
# verified pairing even under Steelbore Blue's restricted accent.
"lapce.button.primary.background" = "#79B4FF"
"lapce.button.primary.foreground" = "#0A1024"

# Icons
"lapce.icon.active" = "#E6F0FF"
"lapce.icon.inactive" = "#66A3FF"

# Remote status
"lapce.remote.icon" = "#0A1024"
"lapce.remote.local" = "#66A3FF"
"lapce.remote.connected" = "#28C76F"
"lapce.remote.connecting" = "#FFC857"
"lapce.remote.disconnected" = "#FF8F8F"

# Plugin list
"lapce.plugin.name" = "#E6F0FF"
