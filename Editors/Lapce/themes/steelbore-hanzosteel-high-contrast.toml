"editor.indent_guide" = "#F4B90020"
"editor.drag_drop_background" = "#FCD61240"
"editor.drag_drop_tab_background" = "#0C0A0640"
"editor.sticky_header_background" = "#1C1811"
"editor.line_number" = "#F4B900"
"editor.active_line_number" = "#F5F0E6"

# Top-level link (legacy bare key, kept alongside editor.link)
"link" = "#F4B900"

# Inlay hints / error lens / completion lens
"inlay_hint.foreground" = "#F4B900"
"inlay_hint.background" = "#FCD61220"
"error_lens.error.foreground" = "#FF8F8F"
"error_lens.error.background" = "#FF8F8F20"
"error_lens.warning.foreground" = "#F7D02A"
"error_lens.warning.background" = "#F7D02A20"
"error_lens.other.foreground" = "#F4B900"
"error_lens.other.background" = "#F4B90020"
"completion_lens.foreground" = "#F4B900"

# Panel
"panel.background" = "#1C1811"
"panel.foreground" = "#F5F0E6"
"panel.foreground.dim" = "#F4B900"
"panel.current.background" = "#FCD61240"
"panel.current.foreground" = "#F5F0E6"
"panel.current.foreground.dim" = "#F4B900"
"panel.hovered.background" = "#0C0A06"
"panel.hovered.active.background" = "#1C1811"
"panel.hovered.active.foreground" = "#FCD612"
"panel.hovered.foreground" = "#F5F0E6"
"panel.hovered.foreground.dim" = "#F4B900"

# Status bar — modal fills use background-coloured text on a role
# fill, the one inversion rule 3 allows (background text on an
# accent/structure/success/error fill); each of the four modes
# takes a distinct role from that exact list, never focus/warning.
"status.background" = "#000000"
"status.foreground" = "#F4B900"
"status.modal.normal.background" = "#F4B900"
"status.modal.normal.foreground" = "#000000"
"status.modal.insert.background" = "#5BE49B"
"status.modal.insert.foreground" = "#000000"
"status.modal.visual.background" = "#FF8F8F"
"status.modal.visual.foreground" = "#000000"
"status.modal.terminal.background" = "#FCD612"
"status.modal.terminal.foreground" = "#000000"

# Tabs — underline is decorative (rule 4: plain accent is fine for
# non-text fills/borders/icons); the active label is text, so it
# takes the text-safe accent.
"lapce.tab.active.background" = "#000000"
"lapce.tab.active.foreground" = "#FCD612"
"lapce.tab.active.underline" = "#FCD612"
"lapce.tab.inactive.background" = "#1C1811"
"lapce.tab.inactive.foreground" = "#F4B900"
"lapce.tab.inactive.underline" = "#FCD61277"
"lapce.tab.separator" = "#F4B900"

# Scroll bar / dropdown shadow / border
"lapce.scroll_bar" = "#F4B90070"
"lapce.dropdown_shadow" = "#00000080"
"lapce.border" = "#F4B900"

# Buttons — the fill takes the text-safe accent so the background-
# coloured label on top (the allowed inversion, rule 3) stays a
# verified pairing even under Steelbore Blue's restricted accent.
"lapce.button.primary.background" = "#FCD612"
"lapce.button.primary.foreground" = "#000000"

# Icons
"lapce.icon.active" = "#F5F0E6"
"lapce.icon.inactive" = "#F4B900"

# Remote status
"lapce.remote.icon" = "#000000"
"lapce.remote.local" = "#F4B900"
"lapce.remote.connected" = "#5BE49B"
"lapce.remote.connecting" = "#F7D02A"
"lapce.remote.disconnected" = "#FF8F8F"

# Plugin list
"lapce.plugin.name" = "#F5F0E6"
