[theme]
name = "Steelbore Hanzo Steel High Contrast"
author = "Mohamed Hammad"
color-theme.name = "Steelbore Hanzo Steel High Contrast"
color-theme.type = "dark"

[color-theme.ui]
# Editor
"editor.background" = "#000000"
"editor.foreground" = "#F5F0E6"
"editor.dim" = "#F4B900"
"editor.focus" = "#FCD612"
"editor.caret" = "#F5F0E6"
