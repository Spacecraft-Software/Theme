"editor.drag_drop_tab_background" = "#00002740"
"editor.sticky_header_background" = "#000027"
"editor.line_number" = "#4B7EB0"
"editor.active_line_number" = "#D98E32"

# Top-level link (legacy bare key, kept alongside editor.link)
"link" = "#4B7EB0"

# Inlay hints / error lens / completion lens
"inlay_hint.foreground" = "#4B7EB0"
"inlay_hint.background" = "#8BE9FD20"
"error_lens.error.foreground" = "#FF5C5C"
"error_lens.error.background" = "#FF5C5C20"
"error_lens.warning.foreground" = "#D98E32"
"error_lens.warning.background" = "#D98E3220"
"error_lens.other.foreground" = "#4B7EB0"
"error_lens.other.background" = "#4B7EB020"
"completion_lens.foreground" = "#4B7EB0"

# Panel
"panel.background" = "#000027"
"panel.foreground" = "#D98E32"
"panel.foreground.dim" = "#4B7EB0"
"panel.current.background" = "#4B7EB040"
"panel.current.foreground" = "#D98E32"
"panel.current.foreground.dim" = "#4B7EB0"
"panel.hovered.background" = "#000027"
"panel.hovered.active.background" = "#000027"
"panel.hovered.active.foreground" = "#4B7EB0"
"panel.hovered.foreground" = "#D98E32"
"panel.hovered.foreground.dim" = "#4B7EB0"

# Status bar — modal fills use background-coloured text on a role
# fill, the one inversion rule 3 allows (background text on an
# accent/structure/success/error fill); each of the four modes
# takes a distinct role from that exact list, never focus/warning.
"status.background" = "#000027"
"status.foreground" = "#4B7EB0"
"status.modal.normal.background" = "#4B7EB0"
"status.modal.normal.foreground" = "#000027"
"status.modal.insert.background" = "#50FA7B"
"status.modal.insert.foreground" = "#000027"
"status.modal.visual.background" = "#FF5C5C"
"status.modal.visual.foreground" = "#000027"
"status.modal.terminal.background" = "#4B7EB0"
"status.modal.terminal.foreground" = "#000027"

# Tabs — underline is decorative (rule 4: plain accent is fine for
# non-text fills/borders/icons); the active label is text, so it
# takes the text-safe accent.
"lapce.tab.active.background" = "#000027"
"lapce.tab.active.foreground" = "#4B7EB0"
"lapce.tab.active.underline" = "#4B7EB0"
"lapce.tab.inactive.background" = "#000027"
"lapce.tab.inactive.foreground" = "#4B7EB0"
"lapce.tab.inactive.underline" = "#4B7EB077"
"lapce.tab.separator" = "#4B7EB0"

# Scroll bar / dropdown shadow / border
"lapce.scroll_bar" = "#4B7EB070"
"lapce.dropdown_shadow" = "#00002780"
"lapce.border" = "#4B7EB0"

# Buttons — the fill takes the text-safe accent so the background-
# coloured label on top (the allowed inversion, rule 3) stays a
# verified pairing even under Steelbore Blue's restricted accent.
"lapce.button.primary.background" = "#4B7EB0"
"lapce.button.primary.foreground" = "#000027"

# Icons
"lapce.icon.active" = "#D98E32"
"lapce.icon.inactive" = "#4B7EB0"

# Remote status
"lapce.remote.icon" = "#000027"
"lapce.remote.local" = "#4B7EB0"
"lapce.remote.connected" = "#50FA7B"
