[theme]
name = "Steelbore Classic"
author = "Mohamed Hammad"
color-theme.name = "Steelbore Classic"
color-theme.type = "dark"

[color-theme.ui]
# Editor
"editor.background" = "#000027"
"editor.foreground" = "#D98E32"
"editor.dim" = "#4B7EB0"
"editor.focus" = "#8BE9FD"
"editor.caret" = "#D98E32"
