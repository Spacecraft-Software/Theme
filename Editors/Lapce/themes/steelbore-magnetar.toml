[theme]
name = "Steelbore Magnetar"
author = "Mohamed Hammad"
color-theme.name = "Steelbore Magnetar"
color-theme.type = "dark"

[color-theme.ui]
# Editor
"editor.background" = "#141418"
"editor.foreground" = "#FFFFFF"
"editor.dim" = "#FC8AFF"
"editor.focus" = "#FDBBFF"
"editor.caret" = "#FFFFFF"
"editor.selection" = "#E445FF40"
"editor.current_line" = "#1E1E22"
"editor.debug_break_line" = "#FFC85740"
"editor.link" = "#FC8AFF"
"editor.visible_whitespace" = "#FC8AFF40"
"editor.indent_guide" = "#FC8AFF20"
"editor.drag_drop_background" = "#E445FF40"
"editor.drag_drop_tab_background" = "#28282D40"
"editor.sticky_header_background" = "#1E1E22"
"editor.line_number" = "#FC8AFF"
"editor.active_line_number" = "#FFFFFF"

# Top-level link (legacy bare key, kept alongside editor.link)
"link" = "#FC8AFF"

# Inlay hints / error lens / completion lens
"inlay_hint.foreground" = "#FC8AFF"
"inlay_hint.background" = "#FDBBFF20"
"error_lens.error.foreground" = "#FF6B6B"
"error_lens.error.background" = "#FF6B6B20"
"error_lens.warning.foreground" = "#FFC857"
"error_lens.warning.background" = "#FFC85720"
"error_lens.other.foreground" = "#FC8AFF"
"error_lens.other.background" = "#FC8AFF20"
"completion_lens.foreground" = "#FC8AFF"

# Panel
"panel.background" = "#1E1E22"
"panel.foreground" = "#FFFFFF"
"panel.foreground.dim" = "#FC8AFF"
"panel.current.background" = "#E445FF40"
"panel.current.foreground" = "#FFFFFF"
"panel.current.foreground.dim" = "#FC8AFF"
"panel.hovered.background" = "#28282D"
"panel.hovered.active.background" = "#1E1E22"
"panel.hovered.active.foreground" = "#E445FF"
"panel.hovered.foreground" = "#FFFFFF"
"panel.hovered.foreground.dim" = "#FC8AFF"

# Status bar — modal fills use background-coloured text on a role
# fill, the one inversion rule 3 allows (background text on an
# accent/structure/success/error fill); each of the four modes
# takes a distinct role from that exact list, never focus/warning.
"status.background" = "#141418"
"status.foreground" = "#FC8AFF"
"status.modal.normal.background" = "#FC8AFF"
"status.modal.normal.foreground" = "#141418"
"status.modal.insert.background" = "#5BE49B"
"status.modal.insert.foreground" = "#141418"
"status.modal.visual.background" = "#FF6B6B"
"status.modal.visual.foreground" = "#141418"
"status.modal.terminal.background" = "#E445FF"
"status.modal.terminal.foreground" = "#141418"

# Tabs — underline is decorative (rule 4: plain accent is fine for
# non-text fills/borders/icons); the active label is text, so it
# takes the text-safe accent.
"lapce.tab.active.background" = "#141418"
"lapce.tab.active.foreground" = "#E445FF"
"lapce.tab.active.underline" = "#E445FF"
"lapce.tab.inactive.background" = "#1E1E22"
"lapce.tab.inactive.foreground" = "#FC8AFF"
"lapce.tab.inactive.underline" = "#E445FF77"
"lapce.tab.separator" = "#FC8AFF"

# Scroll bar / dropdown shadow / border
"lapce.scroll_bar" = "#FC8AFF70"
"lapce.dropdown_shadow" = "#14141880"
"lapce.border" = "#FC8AFF"

# Buttons — the fill takes the text-safe accent so the background-
# coloured label on top (the allowed inversion, rule 3) stays a
# verified pairing even under Steelbore Blue's restricted accent.
"lapce.button.primary.background" = "#E445FF"
"lapce.button.primary.foreground" = "#141418"

# Icons
"lapce.icon.active" = "#FFFFFF"
"lapce.icon.inactive" = "#FC8AFF"

# Remote status
"lapce.remote.icon" = "#141418"
"lapce.remote.local" = "#FC8AFF"
"lapce.remote.connected" = "#5BE49B"
"lapce.remote.connecting" = "#FFC857"
"lapce.remote.disconnected" = "#FF6B6B"

# Plugin list
"lapce.plugin.name" = "#FFFFFF"
"lapce.plugin.description" = "#FC8AFF"
"lapce.plugin.author" = "#FC8AFF"

# Top-level status aliases
"lapce.error" = "#FF6B6B"
"lapce.warn" = "#FFC857"

# Source control
"source_control.added" = "#5BE49BCC"
"source_control.removed" = "#FF6B6BCC"
"source_control.modified" = "#FFC857CC"

# Tooltip / palette / completion / hover
"tooltip.background" = "#1E1E22"
"tooltip.foreground" = "#FFFFFF"
"palette.background" = "#1E1E22"
"palette.foreground" = "#FFFFFF"
"palette.current.background" = "#E445FF40"
"palette.current.foreground" = "#FFFFFF"
"completion.background" = "#1E1E22"
"completion.current" = "#E445FF40"
"hover.background" = "#1E1E22"

# Activity bar
"activity.background" = "#1E1E22"
"activity.current" = "#141418"

# Debug
"debug.breakpoint" = "#FF6B6B"
"debug.breakpoint.hover" = "#FF6B6B40"

# Markdown
"markdown.blockquote" = "#FC8AFF"

