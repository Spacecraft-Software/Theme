[theme]
name = "Steelbore Biolume"
author = "Mohamed Hammad"
color-theme.name = "Steelbore Biolume"
color-theme.type = "dark"

[color-theme.ui]
# Editor
"editor.background" = "#0C1A2B"
"editor.foreground" = "#C7D2D9"
"editor.dim" = "#00F0FF"
"editor.focus" = "#B6FF3B"
"editor.caret" = "#C7D2D9"
"editor.selection" = "#B6FF3B40"
"editor.current_line" = "#1B2630"
"editor.debug_break_line" = "#FFC85740"
"editor.link" = "#00F0FF"
"editor.visible_whitespace" = "#00F0FF40"
"editor.indent_guide" = "#00F0FF20"
"editor.drag_drop_background" = "#B6FF3B40"
"editor.drag_drop_tab_background" = "#05070A40"
"editor.sticky_header_background" = "#1B2630"
"editor.line_number" = "#00F0FF"
"editor.active_line_number" = "#C7D2D9"

# Top-level link (legacy bare key, kept alongside editor.link)
"link" = "#00F0FF"

# Inlay hints / error lens / completion lens
"inlay_hint.foreground" = "#00F0FF"
"inlay_hint.background" = "#B6FF3B20"
"error_lens.error.foreground" = "#FF6B6B"
"error_lens.error.background" = "#FF6B6B20"
"error_lens.warning.foreground" = "#FFC857"
"error_lens.warning.background" = "#FFC85720"
"error_lens.other.foreground" = "#00F0FF"
"error_lens.other.background" = "#00F0FF20"
"completion_lens.foreground" = "#00F0FF"

# Panel
"panel.background" = "#1B2630"
"panel.foreground" = "#C7D2D9"
"panel.foreground.dim" = "#00F0FF"
"panel.current.background" = "#B6FF3B40"
"panel.current.foreground" = "#C7D2D9"
"panel.current.foreground.dim" = "#00F0FF"
"panel.hovered.background" = "#05070A"
"panel.hovered.active.background" = "#1B2630"
"panel.hovered.active.foreground" = "#B6FF3B"
"panel.hovered.foreground" = "#C7D2D9"
"panel.hovered.foreground.dim" = "#00F0FF"

# Status bar — modal fills use background-coloured text on a role
# fill, the one inversion rule 3 allows (background text on an
# accent/structure/success/error fill); each of the four modes
# takes a distinct role from that exact list, never focus/warning.
"status.background" = "#0C1A2B"
"status.foreground" = "#00F0FF"
"status.modal.normal.background" = "#00F0FF"
"status.modal.normal.foreground" = "#0C1A2B"
"status.modal.insert.background" = "#00B39A"
"status.modal.insert.foreground" = "#0C1A2B"
"status.modal.visual.background" = "#FF6B6B"
"status.modal.visual.foreground" = "#0C1A2B"
"status.modal.terminal.background" = "#B6FF3B"
"status.modal.terminal.foreground" = "#0C1A2B"

# Tabs — underline is decorative (rule 4: plain accent is fine for
# non-text fills/borders/icons); the active label is text, so it
# takes the text-safe accent.
"lapce.tab.active.background" = "#0C1A2B"
"lapce.tab.active.foreground" = "#B6FF3B"
"lapce.tab.active.underline" = "#B6FF3B"
"lapce.tab.inactive.background" = "#1B2630"
"lapce.tab.inactive.foreground" = "#00F0FF"
"lapce.tab.inactive.underline" = "#B6FF3B77"
"lapce.tab.separator" = "#00F0FF"

# Scroll bar / dropdown shadow / border
"lapce.scroll_bar" = "#00F0FF70"
"lapce.dropdown_shadow" = "#0C1A2B80"
"lapce.border" = "#00F0FF"

# Buttons — the fill takes the text-safe accent so the background-
# coloured label on top (the allowed inversion, rule 3) stays a
# verified pairing even under Steelbore Blue's restricted accent.
"lapce.button.primary.background" = "#B6FF3B"
"lapce.button.primary.foreground" = "#0C1A2B"

# Icons
"lapce.icon.active" = "#C7D2D9"
"lapce.icon.inactive" = "#00F0FF"

# Remote status
"lapce.remote.icon" = "#0C1A2B"
"lapce.remote.local" = "#00F0FF"
"lapce.remote.connected" = "#00B39A"
"lapce.remote.connecting" = "#FFC857"
