"lapce.plugin.author" = "#00F0FF"

# Top-level status aliases
"lapce.error" = "#FF6B6B"
"lapce.warn" = "#FFC857"

# Source control
"source_control.added" = "#00B39ACC"
"source_control.removed" = "#FF6B6BCC"
"source_control.modified" = "#FFC857CC"

# Tooltip / palette / completion / hover
"tooltip.background" = "#1B2630"
"tooltip.foreground" = "#C7D2D9"
"palette.background" = "#1B2630"
"palette.foreground" = "#C7D2D9"
"palette.current.background" = "#B6FF3B40"
"palette.current.foreground" = "#C7D2D9"
"completion.background" = "#1B2630"
