general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(7FAEDC) rgb(8BE9FD) 45deg
    col.inactive_border = rgb(7FAEDC)
    layout = dwindle
}

decoration {
    rounding = 4
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(000027ee)
}

group {
    col.border_active = rgb(7FAEDC)
    col.border_inactive = rgb(7FAEDC)
    groupbar {
        col.text = rgb(D98E32)
    }
}

misc {
    background_color = rgb(000027)
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
