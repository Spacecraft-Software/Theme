general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(268BD2) rgb(2AA198) 45deg
    col.inactive_border = rgb(6C71C4)
    layout = dwindle
}

decoration {
    rounding = 4
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(002B36ee)
}

group {
    col.border_active = rgb(268BD2)
    col.border_inactive = rgb(6C71C4)
    groupbar {
        col.text = rgb(839496)
    }
}

misc {
    background_color = rgb(002B36)
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
