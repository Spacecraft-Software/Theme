general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(79B4FF) rgb(FF8A4B) 45deg
    col.inactive_border = rgb(66A3FF)
    layout = dwindle
}

decoration {
    rounding = 4
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(0A1024ee)
}

group {
    col.border_active = rgb(79B4FF)
    col.border_inactive = rgb(66A3FF)
    groupbar {
        col.text = rgb(E6F0FF)
    }
}

misc {
    background_color = rgb(0A1024)
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
