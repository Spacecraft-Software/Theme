general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(F400A1) rgb(F400A1) 45deg
    col.inactive_border = rgb(FF46AA)
    layout = dwindle
}

decoration {
    rounding = 4
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(000000ee)
}

group {
    col.border_active = rgb(F400A1)
    col.border_inactive = rgb(FF46AA)
    groupbar {
        col.text = rgb(FFFFFF)
    }
}

misc {
    background_color = rgb(000000)
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
