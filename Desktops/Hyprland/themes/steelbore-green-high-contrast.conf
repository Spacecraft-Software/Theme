general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(E8FFF0) rgb(E8FFF0) 45deg
    col.inactive_border = rgb(25B85F)
    layout = dwindle
}

decoration {
    rounding = 4
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(0D0208ee)
}

group {
    col.border_active = rgb(E8FFF0)
    col.border_inactive = rgb(25B85F)
    groupbar {
        col.text = rgb(00FF41)
    }
}

misc {
    background_color = rgb(0D0208)
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
