border_width = 2
margin = 4
workspace_margin = 4
default_border_color = "#0E2A47"
floating_border_color = "#B4FF00"
focused_border_color = "#FF5E00"

# Gutters (Gap between windows)
gutter = [
    { side = "Top", value = 0, render = false },
    { side = "Bottom", value = 0, render = false },
    { side = "Left", value = 0, render = false },
    { side = "Right", value = 0, render = false },
]

[on_new_window]
enabled = true

