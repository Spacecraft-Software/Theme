border_width = 2
margin = 4
workspace_margin = 4
default_border_color = "#1C1811"
floating_border_color = "#5BE49B"
focused_border_color = "#FCD612"

# Gutters (Gap between windows)
gutter = [
    { side = "Top", value = 0, render = false },
    { side = "Bottom", value = 0, render = false },
    { side = "Left", value = 0, render = false },
    { side = "Right", value = 0, render = false },
]

[on_new_window]
enabled = true

